[package]
name = "pydumpling-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Optional native value walker for pydumpling's bounded snapshots"
license = "MIT"
publish = false

[lib]
# The extension module is imported as ``pydumpling._native``.
name = "_native"
crate-type = ["cdylib"]

[dependencies]
# The stable ABI of CPython 3.12+; 3.11 runs the Python walk only. On 3.11 C
# calls count toward the Python recursion limit itself, which the level the
# walker's entry adds beneath application code and Python-mode nodes would
# then move; the contract excepts only the C limit (rust/DESIGN.md).
pyo3 = { version = "=0.30.1", features = ["abi3-py312"] }
# The current thread's real stack bounds, so the walk never outgrows a small
# thread stack.
stacker = "=0.1.25"

[build-dependencies]
pyo3-build-config = "=0.30.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
