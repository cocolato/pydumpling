[package]
name = "pydumpling-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Optional native value walker for pydumpling's bounded snapshots"
license = "MIT"
publish = false

[lib]
# The extension module is imported as ``pydumpling._native``.
name = "_native"
crate-type = ["cdylib"]

[dependencies]
# CPython 3.12+: on 3.11, C calls share the recursion limit with Python
# frames, so a call handed back to the Python walk would overflow earlier.
pyo3 = { version = "=0.30.1", features = ["abi3-py312"] }
# The current thread's real stack bounds, so the walk never outgrows a small
# thread stack.
stacker = "=0.1.25"

[build-dependencies]
pyo3-build-config = "=0.30.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
