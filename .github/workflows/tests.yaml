name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: '3.11', os: ubuntu-latest}
          - {python: '3.12', os: ubuntu-latest}
          - {python: '3.13', os: ubuntu-latest}
          - {python: '3.14', os: ubuntu-latest}
          - {python: '3.15', os: ubuntu-latest}
          - {python: '3.14', os: windows-latest}
          - {python: '3.14', os: macos-latest}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --dev --python python
      - name: Verify interpreter
        run: uv run --locked python -c "import sys; assert '.'.join(map(str, sys.version_info[:2])) == '${{ matrix.python }}'; assert sys.version_info.releaselevel == 'final'; print(sys.version)"
      - name: Test with coverage
        run: uv run --locked pytest --cov=pydumpling --cov-report=term-missing --cov-fail-under=85

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --locked --dev --python 3.14
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check pydumpling tests docs/source/conf.py

  distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --locked --dev --python 3.14
      - name: Build wheel from source distribution
        run: |
          uv build --sdist
          uv build --wheel dist/*.tar.gz
          uv run --locked twine check --strict dist/*
      - name: Install wheel and check entry points outside checkout
        shell: bash
        run: |
          smoke_dir=$(mktemp -d)
          uv venv --python 3.14 "$smoke_dir/venv"
          uv pip install --python "$smoke_dir/venv/bin/python" dist/*.whl
          cd "$smoke_dir"
          "$smoke_dir/venv/bin/python" -c 'import importlib.metadata, pydumpling; assert pydumpling.__version__ == importlib.metadata.version("pydumpling")'
          "$smoke_dir/venv/bin/python" -m pydumpling --help
          "$smoke_dir/venv/bin/python" -m pydumpling --version
          "$smoke_dir/venv/bin/pydumpling" --help
          "$smoke_dir/venv/bin/pydumpling" --version
