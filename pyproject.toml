[project]
name = "pydumpling"
dynamic = ["version"]
description = "Python post-mortem debugger"
authors = [
    {name = "cocolato", email = "haiizhu@outlook.com"},
]
dependencies = [
    "dill>=0.4.1,<1",
    "packaging>=26.3",
]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Debuggers",
]

[project.urls]
homepage = "https://github.com/cocolato/pydumpling"
repository = "https://github.com/cocolato/pydumpling"
issues = "https://github.com/cocolato/pydumpling/issues"

[project.scripts]
pydumpling = "pydumpling.cli:main"

[project.optional-dependencies]
doc = [
    "sphinx>=8.2.3,<10",
    "sphinx-rtd-theme>=3.0.2,<4",
    "sphinx-tabs>=3.4.7,<4",
    "sphinx-copybutton>=0.5.2,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1",
    "ruff>=0.17",
    "twine>=6.2",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "pydumpling/_version.py"

[tool.hatch.build.targets.sdist]
include = [
    "/pydumpling",
    "/tests",
    "/docs",
    "/static",
    "/README.md",
    "/README_zh.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
]
exclude = ["__pycache__", "*.pyc", "/docs/build"]

[tool.hatch.build.targets.wheel]
packages = ["pydumpling"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["pydumpling"]

[tool.coverage.report]
show_missing = true
fail_under = 85

